<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- First visit in a normal browser tab: show the landing page (public/welcome.html).
         Skipped for the installed app, for anyone with a saved game, and for links from the
         landing page itself (/?play=host, /?play=join). Runs before anything renders. -->
    <script>
      (function () {
        try {
          if (/[?&]play=/.test(location.search)) { sessionStorage.setItem('trivia-skip-landing', '1'); return; }
          if (sessionStorage.getItem('trivia-skip-landing')) return;
          if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) return;
          if (sessionStorage.getItem('trivia-session') || localStorage.getItem('trivia-session')) return;
          location.replace('/welcome.html');
        } catch (e) { /* storage blocked: just load the game */ }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Pinch zoom stays available (accessibility). Double-tap zoom is turned off in CSS instead
         (touch-action: manipulation), so fast taps on answer buttons never zoom the page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amali's Trivia Game 🎉</title>
    <meta name="description" content="A multiplayer trivia game for family and friends: one host, up to 10 players, answer on your phone." />

    <!-- PWA: installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#150A33" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS Safari "Add to Home Screen" -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Amali's Trivia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
